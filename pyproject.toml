[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "venv",
  "node_modules",
]

[tool.ruff.lint]
# Legacy V1 contains many harmless unused-import/unused-variable findings.
# The initial CI gate blocks only errors that can represent broken Python
# semantics. The broader F/E/W cleanup is tracked separately and will be
# enabled incrementally once the baseline is green.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
