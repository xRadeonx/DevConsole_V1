[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sisper-devconsole"
version = "1.1.0.dev0"
description = "Local development and DevOps control plane for SISPER/PROTEO"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Dependencies already accepted in shadow mode and covered by compatibility
# tests. They are still optional until their adapters are promoted to the V1
# runtime paths.
modernization = [
  "psutil>=5.9,<8",
  "pydantic>=2.7,<3",
  "ruamel.yaml>=0.18,<0.19",
]
# Evaluated technologies that have not passed a promotion GO yet. Keeping them
# out of `modernization` avoids installing code that the product does not use.
watcher-experimental = ["watchfiles>=0.21,<2"]
terminal-experimental = ["websockets>=13,<17"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "playwright>=1.49,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["devconsole*"]
exclude = ["tests*", "static*", "config*", "deploy*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "static/vendor",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
