[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "venv",
  "node_modules",
]

[tool.ruff.lint]
# F/E9 provide a low-noise baseline gate first. Broader style rules will be
# enabled only after the legacy tree has been characterized and cleaned.
select = ["F", "E9"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
