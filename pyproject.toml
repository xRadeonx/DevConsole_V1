[project]
name = "sisper-devconsole"
version = "1.1.0.dev0"
description = "Local development and DevOps control plane for SISPER/PROTEO"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
modernization = [
  "psutil>=5.9,<8",
  "pydantic>=2.7,<3",
  "ruamel.yaml>=0.18,<0.19",
  "watchfiles>=0.21,<2",
  "websockets>=13,<17",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "playwright>=1.49,<2",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "static/vendor",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
