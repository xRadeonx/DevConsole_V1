name: DevConsole CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-regression:
    name: V1.1 regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q dashboard.py devconsole tests

      - name: Validate shell entrypoints
        run: bash -n install_devconsole.sh

      - name: Run stable security baseline and V1.1 contracts
        run: |
          python -m unittest -v \
            tests.devconsole.test_security_boundary \
            tests.devconsole.test_runtime_safety \
            tests.devconsole.test_product_credentials \
            tests.devconsole.test_v11_access \
            tests.devconsole.test_project_detector \
            tests.devconsole.test_v11_capabilities \
            tests.devconsole.test_process_observer \
            tests.devconsole.test_yaml_service \
            tests.devconsole.test_config_schema

  modernization-tooling:
    name: Modernization dependency gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install modernization dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "psutil>=5.9,<8" \
            "pydantic>=2.7,<3" \
            "ruamel.yaml>=0.18,<0.19" \
            "watchfiles>=0.21,<2" \
            "websockets>=13,<17"

      - name: Import modernization dependencies
        run: |
          python - <<'PY'
          import psutil
          import pydantic
          import ruamel.yaml
          import watchfiles
          import websockets
          print("modernization dependencies: OK")
          PY

      - name: Run V1.1 tests with optional dependencies available
        run: |
          python -m unittest -v \
            tests.devconsole.test_product_credentials \
            tests.devconsole.test_v11_access \
            tests.devconsole.test_project_detector \
            tests.devconsole.test_v11_capabilities \
            tests.devconsole.test_process_observer \
            tests.devconsole.test_yaml_service \
            tests.devconsole.test_config_schema

  legacy-characterization:
    name: Legacy characterization (debt inventory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -t . -v
