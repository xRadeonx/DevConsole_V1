name: DevConsole CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-regression:
    name: V1.1 regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q dashboard.py devconsole tests

      - name: Validate shell entrypoints
        run: |
          bash -n install_devconsole.sh
          bash -n uninstall_devconsole.sh

      - name: Run stable security baseline and V1.1 contracts
        run: |
          python -m unittest -v \
            tests.devconsole.test_security_boundary \
            tests.devconsole.test_runtime_safety \
            tests.devconsole.test_product_credentials \
            tests.devconsole.test_v11_access \
            tests.devconsole.test_v11_git_safety \
            tests.devconsole.test_v11_env_safety \
            tests.devconsole.test_v11_read_policy \
            tests.devconsole.test_project_detector \
            tests.devconsole.test_v11_capabilities \
            tests.devconsole.test_process_observer \
            tests.devconsole.test_yaml_service \
            tests.devconsole.test_v11_yaml_promotion \
            tests.devconsole.test_config_schema \
            tests.devconsole.test_v11_legacy_profile \
            tests.devconsole.test_v11_multienv \
            tests.devconsole.test_v11_dock_workspace \
            tests.devconsole.test_v11_ui

  modernization-tooling:
    name: Modernization package gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DevConsole with accepted modernization extras
        run: python -m pip install --disable-pip-version-check ".[modernization]"

      - name: Import accepted modernization dependencies
        run: |
          python - <<'PY'
          import psutil
          import pydantic
          import ruamel.yaml
          import devconsole
          print("modernization package: OK")
          PY

      - name: Run V1.1 tests with optional dependencies available
        run: |
          python -m unittest -v \
            tests.devconsole.test_product_credentials \
            tests.devconsole.test_v11_access \
            tests.devconsole.test_v11_git_safety \
            tests.devconsole.test_v11_env_safety \
            tests.devconsole.test_v11_read_policy \
            tests.devconsole.test_project_detector \
            tests.devconsole.test_v11_capabilities \
            tests.devconsole.test_process_observer \
            tests.devconsole.test_yaml_service \
            tests.devconsole.test_v11_yaml_promotion \
            tests.devconsole.test_config_schema \
            tests.devconsole.test_v11_legacy_profile \
            tests.devconsole.test_v11_multienv \
            tests.devconsole.test_v11_dock_workspace \
            tests.devconsole.test_v11_ui

  v11-quality:
    name: V1.1 code quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for static module syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff>=0.8,<1"

      - name: Lint V1.1 modules and tests
        run: |
          ruff check \
            devconsole/v11_access.py \
            devconsole/v11_capabilities.py \
            devconsole/v11_git_safety.py \
            devconsole/v11_env_safety.py \
            devconsole/v11_legacy_profile.py \
            devconsole/v11_multienv.py \
            devconsole/v11_read_policy.py \
            devconsole/v11_yaml_promotion.py \
            devconsole/v11_ui.py \
            devconsole/config_schema.py \
            devconsole/services/project_detector.py \
            devconsole/services/process_observer.py \
            devconsole/services/yaml_service.py \
            tests/devconsole/test_product_credentials.py \
            tests/devconsole/test_v11_access.py \
            tests/devconsole/test_v11_git_safety.py \
            tests/devconsole/test_v11_env_safety.py \
            tests/devconsole/test_v11_legacy_profile.py \
            tests/devconsole/test_v11_multienv.py \
            tests/devconsole/test_v11_dock_workspace.py \
            tests/devconsole/test_v11_read_policy.py \
            tests/devconsole/test_project_detector.py \
            tests/devconsole/test_v11_capabilities.py \
            tests/devconsole/test_process_observer.py \
            tests/devconsole/test_yaml_service.py \
            tests/devconsole/test_v11_yaml_promotion.py \
            tests/devconsole/test_config_schema.py \
            tests/devconsole/test_v11_ui.py

      - name: Check V1.1 ES-module syntax
        run: |
          for file in \
            static/js/v11/app.js \
            static/js/v11/core/events.js \
            static/js/v11/core/features.js \
            static/js/v11/features/dock-workspace.js \
            static/js/v11/features/multi-env.js \
            static/js/v11/features/terminal-addons.js; do
            node --input-type=module --check < "$file"
          done

  legacy-characterization:
    name: Legacy characterization (debt inventory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -t . -v
