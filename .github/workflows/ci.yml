name: DevConsole V1.1 CI

on:
  push:
    branches:
      - main
      - refactor/v1.1-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: Portable regression / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install QA and V1.1 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff -r requirements-v11.txt

      - name: Prepare non-secret test configuration
        run: |
          if [ ! -f config/secrets.json ]; then
            cp config/secrets.example.json config/secrets.json
          fi

      - name: Compile Python sources
        run: python -m compileall -q dashboard.py devconsole tests

      - name: Ruff critical baseline
        run: ruff check dashboard.py devconsole tests

      - name: Portable regression suite
        run: |
          pytest -q \
            tests/devconsole/test_api_readonly.py \
            tests/devconsole/test_frontend_identity.py \
            tests/devconsole/test_security_boundary.py \
            tests/devconsole/test_tilix_service.py \
            tests/devconsole/test_v11_foundations.py

      - name: Validate V1.1 ES modules syntax
        run: |
          node --input-type=module --check < static/js/app-v11.js
          node --input-type=module --check < static/js/modules/api-client.js
          node --input-type=module --check < static/js/modules/event-bus.js
          node --input-type=module --check < static/js/modules/terminal-enhancements.js
          node --input-type=module --check < static/js/features/projects.js
          node --input-type=module --check < static/js/features/operations.js

  browser-smoke:
    name: Browser smoke / Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install V1.1 dependencies
        run: python -m pip install -r requirements-v11.txt
      - name: Prepare non-secret configuration
        run: cp config/secrets.example.json config/secrets.json
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start DevConsole
        env:
          SISPER_HOST: 127.0.0.1
          SISPER_PORT: "19099"
          SISPER_V11_HANDLER: "1"
          SISPER_LOCAL_TOKEN_REQUIRED: "1"
          XDG_RUNTIME_DIR: ${{ runner.temp }}/devconsole-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          python dashboard.py > "$RUNNER_TEMP/devconsole.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/devconsole.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19099/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/devconsole.log"
          exit 1
      - name: Run browser smoke
        env:
          DEVCONSOLE_E2E_URL: http://127.0.0.1:19099
        run: npx playwright test tests/e2e/v11-smoke.spec.mjs --reporter=line --workers=1
      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/devconsole.log" || true
      - name: Stop DevConsole
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/devconsole.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/devconsole.pid")" 2>/dev/null || true
          fi

  legacy-diagnostic:
    name: Full legacy suite (diagnostic)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test and V1.1 dependencies
        run: python -m pip install pytest -r requirements-v11.txt

      - name: Prepare non-secret test configuration
        run: |
          if [ ! -f config/secrets.json ]; then
            cp config/secrets.example.json config/secrets.json
          fi

      - name: Run complete inherited suite
        run: >-
          pytest -q
          --deselect=tests/devconsole/test_config_discovery.py::GoldenDiscoveryTest::test_discovery_matches_golden_snapshot

  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -path './.git' -prune -o -name '*.sh' -type f -print0)
