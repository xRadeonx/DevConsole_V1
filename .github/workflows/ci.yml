name: DevConsole CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-regression:
    name: Core regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q dashboard.py devconsole tests

      - name: Run critical characterization tests
        run: |
          python -m unittest -v \
            tests.devconsole.test_runtime_safety \
            tests.devconsole.test_runtime_identity \
            tests.devconsole.test_security_boundary \
            tests.devconsole.test_terminal_backend \
            tests.devconsole.test_tmux_backend

  full-characterization:
    name: Full characterization baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -t . -v

  modernization-tooling:
    name: Modernization tooling smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install modernization dependencies
        run: python -m pip install --disable-pip-version-check ".[modernization]"

      - name: Import modernization dependencies
        run: |
          python - <<'PY'
          import psutil
          import pydantic
          import ruamel.yaml
          import watchfiles
          import websockets
          print("modernization dependencies: OK")
          PY
