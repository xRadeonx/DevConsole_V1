name: DevConsole V1.1 CI

on:
  push:
    branches:
      - main
      - refactor/v1.1-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: Portable regression / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Prepare non-secret test configuration
        run: |
          if [ ! -f config/secrets.json ]; then
            cp config/secrets.example.json config/secrets.json
          fi

      - name: Compile Python sources
        run: python -m compileall -q dashboard.py devconsole tests

      - name: Ruff critical baseline
        run: ruff check dashboard.py devconsole tests

      # These suites are reproducible from the repository alone and passed on
      # the untouched V1 baseline. They are the first blocking compatibility
      # gate while the workspace-bound tests are converted to portable fixtures.
      - name: Portable regression suite
        run: |
          pytest -q \
            tests/devconsole/test_api_readonly.py \
            tests/devconsole/test_frontend_identity.py \
            tests/devconsole/test_security_boundary.py \
            tests/devconsole/test_tilix_service.py

  legacy-diagnostic:
    name: Full legacy suite (diagnostic)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Prepare non-secret test configuration
        run: |
          if [ ! -f config/secrets.json ]; then
            cp config/secrets.example.json config/secrets.json
          fi

      # Do not hide the inherited V1 failures. This job remains visible on every
      # run, but is non-blocking until each environment-bound test has a portable
      # fixture or an explicit integration-test environment.
      - name: Run complete inherited suite
        run: >-
          pytest -q
          --deselect=tests/devconsole/test_config_discovery.py::GoldenDiscoveryTest::test_discovery_matches_golden_snapshot

  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -path './.git' -prune -o -name '*.sh' -type f -print0)
