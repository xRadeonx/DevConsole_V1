name: Vendor UI libraries

on:
  push:
    branches:
      - feature/v1.1-modernization
    paths:
      - "tools/vendor-ui/**"
      - ".github/workflows/vendor-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned build dependencies
        working-directory: tools/vendor-ui
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build self-hosted bundles
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          VENDOR="$ROOT/static/vendor/v11"
          NODE="$ROOT/tools/vendor-ui/node_modules"
          mkdir -p "$VENDOR"

          cp "$NODE/split.js/dist/split.min.js" "$VENDOR/split.min.js"
          cp "$NODE/gridjs/dist/gridjs.umd.js" "$VENDOR/gridjs.umd.js"
          cp "$NODE/gridjs/dist/theme/mermaid.min.css" "$VENDOR/gridjs-mermaid.min.css"

          "$NODE/.bin/esbuild" "$ROOT/tools/vendor-ui/codemirror-entry.js" \
            --bundle \
            --format=iife \
            --global-name=DevConsoleCodeMirror \
            --platform=browser \
            --target=es2020 \
            --minify \
            --legal-comments=none \
            --outfile="$VENDOR/codemirror.bundle.js"

          {
            echo "DevConsole V1.1 self-hosted UI dependencies"
            echo "==========================================="
            echo
            echo "split.js 1.6.5 — MIT — https://github.com/nathancahill/split"
            echo "Grid.js 6.2.0 — MIT — https://github.com/grid-js/gridjs"
            echo "CodeMirror 6 packages — MIT — https://github.com/codemirror"
            echo
            echo "---- split.js LICENSE ----"
            cat "$NODE/split.js/LICENSE"
            echo
            echo "---- Grid.js LICENSE ----"
            cat "$NODE/gridjs/LICENSE"
            echo
            echo "---- CodeMirror LICENSE ----"
            cat "$NODE/codemirror/LICENSE" 2>/dev/null || true
            cat "$NODE/@codemirror/state/LICENSE" 2>/dev/null || true
          } > "$VENDOR/THIRD_PARTY_LICENSES.txt"

          printf '%s\n' \
            'split.js=1.6.5' \
            'gridjs=6.2.0' \
            'codemirror=6.0.2' \
            '@codemirror/lang-json=6.0.2' \
            '@codemirror/lang-yaml=6.1.2' \
            '@codemirror/theme-one-dark=6.1.2' \
            > "$VENDOR/VERSIONS.txt"

      - name: Commit generated vendor assets
        shell: bash
        run: |
          set -euo pipefail
          git add static/vendor/v11
          if git diff --cached --quiet; then
            echo "Vendor assets already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(ui): vendor Split Grid.js and CodeMirror bundles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
